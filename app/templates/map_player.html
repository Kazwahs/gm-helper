{% extends "base_bare.html" %}
{% block title %}{{ map.title }}{% endblock %}
{% block body %}
<div class="player-stage" id="player-stage" style="visibility:hidden;">{{ map.svg | safe }}</div>
<div class="handout-overlay" id="handout" hidden role="dialog" aria-modal="false" aria-labelledby="handout-title">
  <div class="handout-card">
    <button type="button" class="handout-close secondary" id="handout-close" aria-label="Close handout">&times;</button>
    <h2 id="handout-title"></h2>
    <div id="handout-body" class="md"></div>
    <img id="handout-image" alt="" hidden>
  </div>
</div>
<div class="player-bar">
  <span class="player-title">{{ map.title }}</span>
  <span id="player-status" class="muted" role="status"></span>
  {% if can_move %}<a class="button-link" href="/play">My campaigns</a>{% endif %}
  <button type="button" id="fullscreen-btn" class="secondary">Full screen</button>
</div>
{% endblock %}
{% block scripts %}
<script>
const mapId = {{ map.id }};
const svg = document.querySelector('#player-stage svg');
// Let the browser scale the map to the window instead of its fixed pixel size.
svg.removeAttribute('width');
svg.removeAttribute('height');

const statusEl = document.getElementById('player-status');
const handoutBox = document.getElementById('handout');
let lastVersion = null;
let dismissedHandout = null;     // signature of a handout the table closed on this screen

function showHandout(h) {
  if (!h) { handoutBox.hidden = true; dismissedHandout = null; return; }
  const sig = JSON.stringify([h.id, h.title, h.body, h.image_url]);
  if (sig === dismissedHandout) return;
  document.getElementById('handout-title').textContent = h.title;
  const body = document.getElementById('handout-body');
  const img = document.getElementById('handout-image');
  if (h.kind === 'image' && h.image_url) {
    body.replaceChildren();
    img.src = h.image_url;
    img.alt = h.title;
    img.hidden = false;
  } else {
    img.hidden = true;
    img.removeAttribute('src');
    body.replaceChildren(renderMarkdown(h.body));
  }
  handoutBox.dataset.sig = sig;
  handoutBox.hidden = false;
}

function closeHandout() {
  dismissedHandout = handoutBox.dataset.sig || null;
  handoutBox.hidden = true;
}
document.getElementById('handout-close').addEventListener('click', closeHandout);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !handoutBox.hidden) closeHandout(); });

// A signed-in player can drag the tokens the GM handed to them (state.tokens[].mine).
const canMove = {{ can_move | tojson }};
let lastTokens = [];
let dragging = null;

function toSvgPoint(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const m = svg.getScreenCTM();
  if (!m) return null;
  const p = pt.matrixTransform(m.inverse());
  return {x: p.x, y: p.y};
}

function markMine(tokens) {
  if (!canMove) return;
  const mine = new Set((tokens || []).filter((t) => t.mine).map((t) => String(t.id)));
  svg.querySelectorAll('.token').forEach((node) => {
    if (!mine.has(node.dataset.id)) return;
    node.classList.add('token-mine');
    node.style.cursor = 'grab';
    node.style.touchAction = 'none';
    const disc = node.querySelector('circle:not(.token-turn-ring)');
    if (disc) disc.setAttribute('stroke', '#4fc3f7');   // a blue rim marks the token that's yours
  });
}

function clampToMap(p) {
  const vb = svg.viewBox && svg.viewBox.baseVal;
  if (!vb || !vb.width || !vb.height) return p;
  return {x: Math.min(vb.x + vb.width, Math.max(vb.x, p.x)), y: Math.min(vb.y + vb.height, Math.max(vb.y, p.y))};
}

svg.addEventListener('pointerdown', (e) => {
  if (!canMove || e.button > 0 || dragging) return;
  const node = e.target.closest('.token-mine');
  if (!node) return;
  const t = lastTokens.find((x) => String(x.id) === node.dataset.id);
  const start = toSvgPoint(e);
  if (!t || !start) return;
  e.preventDefault();
  node.setPointerCapture(e.pointerId);
  node.style.cursor = 'grabbing';
  dragging = {t, node, id: e.pointerId, dx: t.x - start.x, dy: t.y - start.y, x: t.x, y: t.y, moved: false};
});
svg.addEventListener('pointermove', (e) => {
  if (!dragging || e.pointerId !== dragging.id) return;
  const pt = toSvgPoint(e);
  if (!pt) return;
  const p = clampToMap({x: pt.x + dragging.dx, y: pt.y + dragging.dy});
  dragging.x = Math.round(p.x * 10) / 10;
  dragging.y = Math.round(p.y * 10) / 10;
  dragging.moved = true;
  dragging.node.setAttribute('transform', `translate(${dragging.x},${dragging.y})`);
});
async function endDrag(e, cancelled) {
  if (!dragging || e.pointerId !== dragging.id) return;
  const {t, node, x, y, moved} = dragging;
  dragging = null;
  node.style.cursor = 'grab';
  if (cancelled || !moved) { if (moved) lastVersion = null; return; }
  try {
    await postForm(`/api/map-tokens/${t.id}/move`, {x, y});
    t.x = x; t.y = y;
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = err.message;
  }
  lastVersion = null;          // redraw from the server's copy on the next poll
}
svg.addEventListener('pointerup', (e) => endDrag(e, false));
svg.addEventListener('pointercancel', (e) => endDrag(e, true));

function show(state) {
  if (state.v === lastVersion) return;
  if (dragging) return;            // don't redraw under the player's finger
  lastVersion = state.v;
  lastTokens = state.tokens || [];
  drawTokens(svg, state.tokens, state.token_radius);
  markMine(state.tokens);
  applyFog(svg, state.reveal, 1);
  showHandout(state.handout);
  document.getElementById('player-stage').style.visibility = 'visible';
}

// The page is rendered with the current table state already in it (no flash of
// the whole map), then re-checks the server every couple of seconds.
show({{ live | tojson }});

async function poll() {
  try {
    const res = await fetch(`/api/maps/${mapId}/live`, {cache: 'no-store'});
    if (res.status === 401) { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname); return; }
    if (!res.ok) throw new Error('bad response');
    show(await res.json());
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'Reconnecting...';
  }
}
setInterval(poll, 2500);

document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => {
  document.querySelector('.player-bar').classList.toggle('hidden', !!document.fullscreenElement);
});
</script>
{% endblock %}
