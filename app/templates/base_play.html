<!doctype html>
<html lang="en" data-theme="{{ theme_name or 'tavern' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GM Helper{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231b1a17%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27serif%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23c4863f%27%3EGM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  {% if theme_name == 'custom' and custom_theme_vars %}
    <style>
      :root[data-theme="custom"] {
        {% for key, value in custom_theme_vars.items() %}--{{ key }}: {{ value }};
        {% endfor %}
      }
    </style>
  {% endif %}
</head>
<body class="play">
  {% set path = request.url.path %}
  <header class="topbar">
    <a class="brand" href="/play">GM Helper</a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">&#9776; Menu</button>
    <nav id="site-nav" aria-label="Main">
      <a href="/play"{% if path == '/play' or path.startswith('/play/campaigns') %} aria-current="page"{% endif %}>My campaigns</a>
      {% if has_library %}<a href="/play/library"{% if path.startswith('/play/library') %} aria-current="page"{% endif %}>Library</a>{% endif %}
      <a href="/account"{% if path == '/account' %} aria-current="page"{% endif %}>Account</a>
    </nav>
    <form method="post" action="/logout" class="signout-form">
      <span class="muted signout-name">{{ me.display_name if me else '' }}</span>
      <button type="submit" class="secondary">Sign out</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ asset('app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
