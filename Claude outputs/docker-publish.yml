name: Test, build and publish Docker image

# 1. Runs the test suite (on every push to main, every pull request and every
#    version tag).
# 2. If the tests pass - and this isn't a pull request - builds the Dockerfile
#    and pushes it to GitHub Container Registry (ghcr.io), so servers can just
#    `docker compose pull` instead of building from source.
#
# Two image variants are published:
#   full  - includes EasyOCR/PyTorch for OCR of scanned PDFs  (tags: latest, sha-<commit>, 1.2.3)
#   slim  - no OCR libraries, far smaller                      (tags: latest-slim, sha-<commit>-slim, 1.2.3-slim)
# Push a tag like v1.2.3 to publish version-numbered images.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [full, slim]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        # Docker image names must be lowercase; GitHub repo/owner names can
        # have uppercase letters, so this can't just use github.repository.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'slim' && '-slim' || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_OCR=${{ matrix.variant == 'full' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
